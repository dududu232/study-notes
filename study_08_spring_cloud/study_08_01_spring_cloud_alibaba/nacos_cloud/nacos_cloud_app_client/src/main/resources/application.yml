server:
  port: 8002
spring:
  application:
    name: nacos-cloud-appclient
  cloud:
    nacos: # 配置nacos相关信息
      # server-addr: 192.168.8.128:8848 # 配置nacos服务器地址。默认localhost:8848
      discovery: # 配置nacos注册中心相关信息。
        server-addr: 192.168.222.128:9000 # 配置nacos注册中心地址。默认${spring.cloud.nacos.server-addr}
        service: nacos-cloud-appclient # 注册到nacos中的spring cloud restful服务名。默认${spring.application.name}
        group: study # 服务的分组。默认值DEFAULT_GROUP。基于Nacos注册的服务会划分分组。同组服务可发现。
    sentinel:
      transport:
        dashboard: 192.168.222.128:8858 # 配置sentinel服务器地址。
        port: 8719 # 代表sentinel客户端和控制台通信的端口，默认为8719，如果这个端口已经被占用，那么sentinel会自动从8719开始依次+1扫描，直到找到未被占用的端口。
dubbo:
  application:
    name: nacos-dubbo-consumer   # dubbo服务的名称
    id: nacos-dubbo-consumer
  registry:
    address: nacos://192.168.222.128:9000
    group: study
  protocol:
    name: dubbo # 协议名称。默认dubbo
    port: -1 # 协议端口。默认20880。定义成-1，可以实现自动递增。从20880开始。自然数递增。
